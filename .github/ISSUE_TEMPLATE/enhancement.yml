name: "Enhancement"
description: "Suggest an improvement to existing functionality."
type: "Enhancement"
projects: ["KeldaDev/1"]
body:
  - type: textarea
    id: current
    attributes:
      label: "Current behaviour"
      description: "How does the existing feature work?"
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: "Proposed improvement"
      description: "What should change?"
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: "Benefits"
      description: "What would this improve for users?"
    validations:
      required: false
