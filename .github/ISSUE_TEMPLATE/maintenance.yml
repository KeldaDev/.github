name: "Maintenance"
description: "Track dependencies, upkeep, refactoring or infrastructure work."
type: "Maintenance"
body:
  - type: textarea
    id: work
    attributes:
      label: "Required work"
      description: "What needs to change?"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Reason"
      description: "Why is this work needed?"
    validations:
      required: true
  - type: input
    id: components
    attributes:
      label: "Affected components"
      description: "Which parts of the system are affected?"
    validations:
      required: false
