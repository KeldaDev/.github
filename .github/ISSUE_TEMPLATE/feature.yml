name: "Feature request"
description: "Suggest new functionality for Kelda."
type: "Feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "What are you trying to do, and what is missing?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed solution"
      description: "Describe the functionality you want."
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: "Use case"
      description: "How would you use this feature?"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Links, examples or alternatives you considered."
    validations:
      required: false
